<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Calendar body -->
  <rect x="24" y="56" width="464" height="432" rx="64" fill="#ffffff"/>
  <!-- Header band -->
  <rect x="24" y="56" width="464" height="104" rx="64" fill="#37474F"/>
  <rect x="24" y="100" width="464" height="60" fill="#37474F"/>
  <!-- Outline drawn last so its edge is continuous -->
  <rect x="24" y="56" width="464" height="432" rx="64" fill="none" stroke="#37474F" stroke-width="20"/>
  <!-- Binder rings -->
  <rect x="134" y="20" width="36" height="84" rx="18" fill="#37474F"/>
  <rect x="342" y="20" width="36" height="84" rx="18" fill="#37474F"/>
  <!-- Three person lanes -->
  <rect x="62"  y="190" width="116" height="264" rx="22" fill="#E0F2F1"/>
  <rect x="198" y="190" width="116" height="264" rx="22" fill="#FFF3E0"/>
  <rect x="334" y="190" width="116" height="264" rx="22" fill="#EDE7F6"/>
  <!-- Events in each lane -->
  <rect x="76"  y="206" width="88" height="86"  rx="16" fill="#26A69A"/>
  <rect x="76"  y="340" width="88" height="98"  rx="16" fill="#26A69A"/>
  <rect x="212" y="250" width="88" height="120" rx="16" fill="#FB8C00"/>
  <rect x="348" y="206" width="88" height="62"  rx="16" fill="#7E57C2"/>
  <rect x="348" y="318" width="88" height="120" rx="16" fill="#7E57C2"/>
</svg>
